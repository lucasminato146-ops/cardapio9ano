<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasil Seleção Completa</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <div class="conteudo">

            <div class="topo">

                <div class="badge">
                    ⚽ Copa do Mundo 2026
                </div>

                <!-- ESCUDO DO BRASIL -->
                <img src="image-removebg-preview.png"
                     class="escudo">

            </div>

            <h1>BRASIL</h1>

            <button id="infoBtn"
                    class="info-btn"
                    onclick="mostrarDescricao()">
                Ver Informações
            </button>

            <div id="descricao" class="descricao">

                <h2>Seleção Brasileira</h2>

                <p>
                    A Seleção Brasileira é a maior campeã da história da Copa do Mundo,
                    com cinco títulos conquistados. Conhecida mundialmente pelo seu
                    futebol ofensivo e habilidoso, revelou grandes craques como Pelé,
                    Ronaldo, Ronaldinho e Neymar.
                </p>

                <a href="https://pay.kiwify.com.br/dx06Txl" target="_blank">
                    <button class="comprar">
                        Comprar Figurinhas
                    </button>
                </a>

            </div>

        </div>

    </div>

    <script>
        function mostrarDescricao() {

            const descricao = document.getElementById("descricao");
            const botao = document.getElementById("infoBtn");

            descricao.style.display = "block";

            botao.style.opacity = "0";

            setTimeout(() => {
                botao.style.display = "none";
            }, 300);

        }
    </script>

</body>
</html>
