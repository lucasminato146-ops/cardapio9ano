<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasil - Figurinhas da Copa</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Montserrat',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
            url('fundo-estadio.jpg');

            background-size:cover;
            background-position:center;
            padding:20px;
        }

        .card{
            width:500px;
            overflow:hidden;

            background:rgba(255,255,255,.08);
            backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,.15);
            border-radius:30px;

            box-shadow:
            0 20px 50px rgba(0,0,0,.4);

            transition:.4s;
        }

        .card:hover{
            transform:translateY(-8px);
        }

        .foto{
            width:100%;
            height:280px;
            object-fit:cover;
        }

        .conteudo{
            padding:25px;
            text-align:center;
        }

        .badge{
            display:inline-block;

            background:#ffcc00;
            color:#000;

            padding:8px 18px;
            border-radius:50px;

            font-weight:700;
            font-size:14px;

            margin-bottom:15px;
        }

        .escudo{
            width:120px;
            height:120px;

            object-fit:contain;

            margin:-70px auto 15px;

            background:white;
            padding:10px;

            border-radius:50%;

            border:5px solid white;

            box-shadow:
            0 5px 20px rgba(0,0,0,.3);
        }

        h1{
            color:white;
            font-size:40px;
            font-weight:800;
            letter-spacing:3px;
            margin-bottom:20px;
        }

        .info-btn{
            background:#ffcc00;
            color:black;

            border:none;
            border-radius:15px;

            padding:14px 25px;

            font-size:16px;
            font-weight:800;

            cursor:pointer;
            transition:.3s;
        }

        .info-btn:hover{
            transform:scale(1.05);
        }

        .descricao{
            display:none;

            margin-top:25px;
            text-align:left;

            background:white;
            border-radius:20px;

            padding:20px;

            animation:aparecer .4s ease;
        }

        .descricao h2{
            color:#009739;
            margin-bottom:10px;
        }

        .descricao p{
            line-height:1.8;
            color:#444;
        }

        .comprar{
            width:100%;
            margin-top:20px;

            background:#009739;
            color:white;

            border:none;
            border-radius:15px;

            padding:16px;

            font-size:18px;
            font-weight:800;

            cursor:pointer;

            transition:.3s;
        }

        .comprar:hover{
            background:#00b84d;
        }

        @keyframes aparecer{
            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <img src="selecao-brasil.jpg" alt="Seleção Brasileira" class="foto">

        <div class="conteudo">

            <div class="badge">⚽ Copa do Mundo 2026</div>

            <img src="escudo-brasil.png" alt="Escudo do Brasil" class="escudo">

            <h1>BRASIL</h1>

            <button class="info-btn" onclick="mostrarDescricao()">
                Ver Informações
            </button>

            <div id="descricao" class="descricao">

                <h2>Seleção Brasileira</h2>

                <p>
                    A Seleção Brasileira é a maior campeã da história da
                    Copa do Mundo, com cinco títulos conquistados. Conhecida
                    mundialmente pelo seu futebol ofensivo e habilidoso,
                    revelou lendas como Pelé, Ronaldo, Ronaldinho e Neymar.
                </p>

                <a href="COLE_SEU_LINK_AQUI" target="_blank">
                    <button class="comprar">
                        Comprar Figurinhas
                    </button>
                </a>

            </div>

        </div>

    </div>

    <script>
        function mostrarDescricao() {
            const descricao = document.getElementById("descricao");

            if (descricao.style.display === "block") {
                descricao.style.display = "none";
            } else {
                descricao.style.display = "block";
            }
        }
    </script>

</body>
</html>
