<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasil Seleção Completa</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <img src="selecao-brasil.jpg" alt="Seleção Brasileira" class="foto">

        <div class="conteudo">

            <div class="topo">

                <div class="badge">
                    ⚽ Copa do Mundo 2026
                </div>

                <img src="image-removebg-preview.png" alt="Escudo do Brasil" class="escudo">

            </div>

            <h1>BRASIL seleção completa</h1>

            <button id="infoBtn" class="info-btn" onclick="mostrarDescricao()">
                Ver Informações
            </button>

            <div id="descricao" class="descricao">

                <h2>Seleção Brasileira</h2>

                <p>
                    A Seleção Brasileira é a maior campeã da história da Copa do Mundo,
                    com cinco títulos conquistados. Conhecida mundialmente pelo seu
                    futebol ofensivo e habilidoso, revelou lendas como Pelé,
                    Ronaldo, Ronaldinho e Neymar.
                </p>

                <a href="COLE_SEU_LINK_AQUI" target="_blank">
                    <button class="comprar">
                        Comprar Figurinhas
                    </button>
                </a>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
